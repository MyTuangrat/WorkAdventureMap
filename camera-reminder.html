<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camera Reminder</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #1e2b4d;
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h2 { margin: 0 0 12px 0; }
    p { color: #cdd6f0; font-size: 15px; }
  </style>
</head>
<body>
  <div class="icon">📷</div>
  <h2>Please turn on your camera</h2>
  <p>Camera should stay on for the duration of the meeting.</p>
</body>
</html>
